services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soc-triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-soc_triage}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  soc-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous-soc-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_pass}@postgres:5432/${POSTGRES_DB:-soc_triage}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: http://127.0.0.1:8000
      PORT: 7860
    ports:
      - "7860:7860"
      - "8001:8000"

volumes:
  postgres_data:
